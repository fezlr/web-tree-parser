<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Users</h1>

    <div class="alert alert-success" th:if="${message != null}" th:text="${message}"></div>
    <div class="alert alert-error" th:if="${error != null}" th:text="${error}"></div>

    <div class="card">
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Created</th>
                    <th>Change role</th>
                    <th>Account</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="account : ${page.content}">
                    <td th:text="${account.id}"></td>
                    <td th:text="${account.username}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${account.role.name() == 'ADMIN'} ? 'badge-admin' : 'badge-user'"
                              th:text="${account.role}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${account.enabled} ? 'badge-active' : 'badge-blocked'"
                              th:text="${account.enabled} ? 'Active' : 'Blocked'"></span>
                    </td>
                    <td th:text="${#temporals.format(account.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td>
                        <form th:unless="${account.id == currentUserId}"
                              th:action="@{/admin/users/{id}/role(id=${account.id})}" method="post">
                            <input type="hidden" name="page" th:value="${page.number}">
                            <select name="role">
                                <option th:each="candidate : ${roles}"
                                        th:value="${candidate}"
                                        th:text="${candidate}"
                                        th:selected="${candidate == account.role}"></option>
                            </select>
                            <button type="submit" class="btn btn-secondary btn-small">Save</button>
                        </form>
                    </td>
                    <td>
                        <form th:unless="${account.id == currentUserId}"
                              th:action="@{/admin/users/{id}/enabled(id=${account.id})}" method="post">
                            <input type="hidden" name="page" th:value="${page.number}">
                            <input type="hidden" name="enabled" th:value="${!account.enabled}">
                            <button type="submit" class="btn btn-small"
                                    th:classappend="${account.enabled} ? 'btn-danger' : 'btn-secondary'"
                                    th:text="${account.enabled} ? 'Block' : 'Unblock'"></button>
                        </form>
                        <span class="muted" th:if="${account.id == currentUserId}">(you)</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="pagination" th:if="${page.totalPages > 1}">
            <a th:if="${page.hasPrevious()}" th:href="@{/admin/users(page=${page.number - 1})}">Previous</a>
            <span class="muted" th:text="|Page ${page.number + 1} of ${page.totalPages}|"></span>
            <a th:if="${page.hasNext()}" th:href="@{/admin/users(page=${page.number + 1})}">Next</a>
        </p>
    </div>
</main>
</body>
</html>
