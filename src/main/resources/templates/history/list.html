<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('History')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>History</h1>

    <form class="card" th:action="@{/history}" th:object="${filter}" method="get">
        <div class="filters">
            <div class="field field-grow">
                <label for="query">Search</label>
                <input type="text" id="query" th:field="*{query}" placeholder="Text inside a set">
            </div>
            <div class="field">
                <label for="from">From</label>
                <input type="date" id="from" th:field="*{from}">
            </div>
            <div class="field">
                <label for="to">To</label>
                <input type="date" id="to" th:field="*{to}">
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Search</button>
                <a class="btn btn-secondary" th:href="@{/history}">Reset</a>
            </div>
        </div>
        <div class="filters-errors">
            <p class="field-error" th:if="${#fields.hasErrors('query')}" th:errors="*{query}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('from')}" th:errors="*{from}"></p>
            <p class="field-error" th:if="${#fields.hasErrors('to')}" th:errors="*{to}"></p>
        </div>
    </form>

    <div class="card" th:if="${page.totalElements == 0}">
        <p class="muted">No entries found.</p>
    </div>

    <div class="card" th:unless="${page.empty}">
        <p class="muted" th:text="|Found ${page.totalElements}|"></p>
        <div class="table-wrap">
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Time</th>
                    <th th:if="${showAuthor}">Author</th>
                    <th>Set</th>
                    <th>Elements</th>
                    <th>Max depth</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${page.content}">
                    <td th:text="${item.id}"></td>
                    <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                    <td th:if="${showAuthor}" th:text="${item.author}"></td>
                    <td><code th:text="${#strings.abbreviate(item.source, 60)}"></code></td>
                    <td th:text="${item.totalElements}"></td>
                    <td th:text="${item.maxDepth}"></td>
                    <td><a class="btn btn-secondary btn-small" th:href="@{/results/{id}(id=${item.id})}">Open</a></td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="pagination" th:if="${page.totalPages > 1}">
            <a th:if="${page.hasPrevious()}"
               th:href="@{/history(page=${page.number - 1}, query=${filter.query}, from=${filter.from}, to=${filter.to})}">Previous</a>
            <span class="muted" th:text="|Page ${page.number + 1} of ${page.totalPages}|"></span>
            <a th:if="${page.hasNext()}"
               th:href="@{/history(page=${page.number + 1}, query=${filter.query}, from=${filter.from}, to=${filter.to})}">Next</a>
        </p>
    </div>
</main>
</body>
</html>
