<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Set parser</title>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<h1>Set parser</h1>

<form th:action="@{/parse}" th:object="${parseRequest}" method="post">
    <label for="input">Set</label>
    <div>
        <textarea id="input" th:field="*{input}" rows="6" cols="70"></textarea>
    </div>
    <div th:if="${#fields.hasErrors('input')}" th:errors="*{input}"></div>
    <button type="submit">Parse</button>
</form>

<h2>Upload a file</h2>

<form th:action="@{/parse/file}" method="post" enctype="multipart/form-data">
    <input type="file" id="file" name="file" accept=".txt,text/plain">
    <button type="submit">Upload and parse</button>
    <div th:if="${fileError != null}" th:text="${fileError}"></div>
</form>
</body>
</html>
