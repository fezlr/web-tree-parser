<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in</title>
</head>
<body>
<h1>Sign in</h1>

<p th:if="${param.error}">Invalid username or password, or the account is not enabled.</p>
<p th:if="${param.logout}">You have been signed out.</p>
<p th:if="${param.registered}">Account created. You can sign in now.</p>

<form th:action="@{/login}" method="post">
    <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus>
    </div>
    <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>
    <button type="submit">Sign in</button>
</form>

<p>No account yet? <a th:href="@{/register}">Register</a></p>
</body>
</html>
