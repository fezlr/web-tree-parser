<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign in')}"></head>
<body class="auth-page">
<main class="card auth-card">
    <h1>Sign in</h1>
    <p class="subtitle muted">Set Tree Parser</p>

    <div class="alert alert-error" th:if="${param.error}">Invalid username or password, or the account is blocked.</div>
    <div class="alert alert-error" th:if="${param.blocked}">Your account has been blocked or removed. You have been signed out.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been signed out.</div>
    <div class="alert alert-success" th:if="${param.registered}">Account created. You can sign in now.</div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="hint">No account yet? <a th:href="@{/register}">Register</a></p>
</main>
</body>
</html>
