<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body class="auth-page">
<main class="card auth-card">
    <h1>Create account</h1>
    <p class="subtitle muted">Set Tree Parser</p>

    <form th:action="@{/register}" th:object="${registerRequest}" method="post" novalidate>
        <div class="field">
            <label for="username">Username</label>
            <input type="text" th:field="*{username}" autocomplete="username" autofocus>
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>

    <p class="hint">Already registered? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
